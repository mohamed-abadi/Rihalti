
workflows:
  android-build:
    name: Rahla90 APK
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Extract project
        script: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$SETTINGS")"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - "**/app/build/outputs/apk/**/*.apk"
